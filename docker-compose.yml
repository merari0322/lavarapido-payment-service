# Entorno local SOLO de payment-service. No depende de operations-service.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: pay-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Lavado_Dev_2026!}"
    ports:
      - "${MSSQL_PORT:-1434}:1433"
    volumes:
      - pay-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver:
        condition: service_healthy
    command:
      - /opt/mssql-tools/bin/sqlcmd
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - "${MSSQL_SA_PASSWORD:-Lavado_Dev_2026!}"
      - -Q
      - "IF DB_ID('lavado_vehicular') IS NULL CREATE DATABASE lavado_vehicular"

  migrate:
    image: liquibase/liquibase:4.29
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./db:/liquibase/changelog/db:ro
    command:
      - --search-path=/liquibase/changelog
      - --changelog-file=db/changelog/db.changelog-master.yaml
      - --url=jdbc:sqlserver://sqlserver:1433;databaseName=lavado_vehicular;encrypt=true;trustServerCertificate=true
      - --username=sa
      - --password=${MSSQL_SA_PASSWORD:-Lavado_Dev_2026!}
      - --database-change-log-table-name=DATABASECHANGELOG_PAYMENT
      - --database-change-log-lock-table-name=DATABASECHANGELOGLOCK_PAYMENT
      - update

volumes:
  pay-sqlserver-data:
