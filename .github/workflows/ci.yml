# Compila y corre las pruebas en cada push o pull request a develop/main.
# Las pruebas de integración corren en su propio job contra un SQL Server desechable (H-13); en el
# job "Compilar y probar" se omiten solas porque ahí no hay base.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore PaymentService.sln

      - run: dotnet build PaymentService.sln --no-restore -c Release

      - name: Pruebas
        run: dotnet test PaymentService.sln --no-build -c Release --logger "trx;LogFilePrefix=results" --results-directory test-results

      - name: Reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # H-13: las pruebas de persistencia (EF Core, índices únicos filtrados, concurrencia real) contra
  # SQL Server 2022, con las mismas migraciones de Liquibase que usa payment-migrate en producción.
  # La base y la contraseña son desechables: solo viven mientras corre este job.
  integration:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SA_PASSWORD: Ci-Payment-${{ github.run_id }}-Aa1!
      DB_NAME: LavaRapidoPaymentIT
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Payment-${{ github.run_id }}-Aa1!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Esperar a SQL Server y crear la base
        run: |
          for _ in $(seq 1 40); do
            if docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost                  -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              break
            fi
            sleep 3
          done
          docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost             -U sa -P "$SA_PASSWORD" -Q "CREATE DATABASE [$DB_NAME]"

      - name: Migraciones (Liquibase, como payment-migrate)
        run: |
          docker run --rm --network host -v "$PWD/db:/liquibase/changelog/db:ro"             -e LIQUIBASE_COMMAND_PASSWORD="$SA_PASSWORD" liquibase/liquibase:4.29             --search-path=/liquibase/changelog             --changelog-file=db/changelog/db.changelog-master.yaml             "--url=jdbc:sqlserver://localhost:1433;databaseName=$DB_NAME;encrypt=true;trustServerCertificate=true"             --username=sa             --database-change-log-table-name=DATABASECHANGELOG_PAYMENT             --database-change-log-lock-table-name=DATABASECHANGELOGLOCK_PAYMENT             update

      - name: Pruebas de integración
        env:
          PAYMENT_INTEGRATION_DB: Server=localhost,1433;Database=${{ env.DB_NAME }};User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True
        run: >
          dotnet test tests/PaymentService.Infrastructure.IntegrationTests -c Release
          --logger "trx;LogFilePrefix=integration" --results-directory test-results

      - name: Reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7

  # CD: cuando un cambio entra a main (PR aprobado) y el CI pasa, pide el despliegue en Azure al
  # workflow "Desplegar en Azure" de lavarapido-infra. Necesita el secreto DEPLOY_DISPATCH_TOKEN
  # (token fine-grained con acceso solo a lavarapido-infra y permiso Actions: Read and write).
  deploy:
    name: Pedir despliegue
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisar a lavarapido-infra
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto DEPLOY_DISPATCH_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -sS --fail-with-body --max-time 30 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/BrayanCABRERA123/lavarapido-infra/actions/workflows/deploy.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"automatic\":\"true\",\"source\":\"$SOURCE\"}}"
          echo "Despliegue pedido: lavarapido-infra → Actions → Desplegar en Azure"
